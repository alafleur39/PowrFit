# Netlify build for the PowrFit web app in web/. The retired Expo app at the
# repo root is not deployed. Netlify's Next.js runtime is added automatically.
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Keep the service worker fresh so each deploy takes over after one reload
# (mirrors web/next.config.ts).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Security-Policy = "default-src 'self'; script-src 'self'"
