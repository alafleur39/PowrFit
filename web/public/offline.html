<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PowrFit Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #111827;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(420px, calc(100vw - 32px));
        padding: 28px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: white;
        box-shadow: 0 16px 45px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0;
        font-size: 24px;
      }
      p {
        color: #64748b;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PowrFit is offline</h1>
      <p>Your saved dashboard shell is available. Reconnect to sync workouts and latest progress.</p>
    </main>
  </body>
</html>
