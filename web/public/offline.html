<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>PowrFit Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(420px, calc(100vw - 32px));
        padding: 28px;
        border: 1px solid #262626;
        border-radius: 10px;
        background: #161616;
      }
      h1 {
        margin: 0;
        font-size: 24px;
      }
      p {
        color: #8e8e93;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PowrFit is offline</h1>
      <p>Your saved dashboard shell is available. Reconnect to sync workouts and latest progress.</p>
    </main>
  </body>
</html>
